<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeBank (demo) – Đăng nhập</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site"><p class="logo">SafeBank <small>(demo)</small></p><nav><a href="index.html">Trang chủ</a></nav></header>
<main><form class="login panel" id="loginForm" autocomplete="off">
<h1 style="font-size:1.6rem">Đăng nhập</h1>
<label for="user">Tên đăng nhập</label><input id="user" name="user" type="text" required>
<label for="pass">Mật khẩu</label><input id="pass" name="pass" type="password" required>
<p class="err" id="err" role="alert"></p>
<button class="btn" type="submit">Đăng nhập</button>
<p class="hint">Tài khoản demo công khai: <b>demo</b> / <b>demo123</b>. Chỉ kiểm tra trên trình duyệt, không gửi đi đâu.</p>
</form></main>
<script src="app.js"></script></body></html>
